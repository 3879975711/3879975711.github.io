<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8e0f12" />
<title>今日首页</title>
<style>
  :root{
    --red-deep:#4d0809;
    --red:#8e0f12;
    --red-bright:#c81e21;
    --gold:#f2cf7d;
    --gold-soft:#ffe6a8;
    --gold-deep:#c99a3f;
    --paper:#f8f5ee;
    --paper-2:#fffdf8;
    --ink:#241f1c;
    --ink-soft:#6a6058;
    --line:rgba(42,35,32,.12);
    --grass:#3f7f2b;
    --amber:#b8792a;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STZhongsong",ui-serif,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%;overflow:hidden;background:var(--red-deep)}

  body{
    font-family:var(--sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 横向双页舞台 ---------- */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    width:200%;
    height:100%;
    transition:transform 1.15s cubic-bezier(.76,0,.18,1);
    will-change:transform;
  }
  body.shifted .stage{transform:translateX(-50%)}

  .panel{
    position:relative;
    flex:0 0 50%;
    width:50%;
    height:100%;
    overflow:hidden;
  }

  /* ================= 第一页：喜庆时间页 ================= */
  .panel-time{
    color:var(--gold-soft);
    background:
      radial-gradient(ellipse 70% 55% at 50% 22%, rgba(255,138,96,.42), rgba(255,138,96,0) 65%),
      radial-gradient(ellipse 60% 45% at 50% 112%, rgba(0,0,0,.55), rgba(0,0,0,0) 70%),
      linear-gradient(158deg,#b8171d 0%,#941013 42%,#6a0a0c 76%,#4d0809 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    cursor:pointer;
  }

  /* 金色暗纹 */
  .panel-time::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,219,151,.14) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 72% 68%, rgba(255,219,151,.10) 0 1.2px, transparent 2.4px),
      linear-gradient(45deg, rgba(255,219,151,.05) 0 1px, transparent 1px),
      linear-gradient(-45deg, rgba(255,219,151,.05) 0 1px, transparent 1px);
    background-size:78px 78px, 122px 122px, 46px 46px, 46px 46px;
    opacity:.9;
    pointer-events:none;
  }

  /* 中央光晕 */
  .panel-time::after{
    content:"";
    position:absolute;
    width:min(74vw,780px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,196,120,.20), rgba(255,150,80,.07) 45%, transparent 68%);
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:54px;
    height:54px;
    border:1px solid rgba(242,207,125,.42);
    pointer-events:none;
  }
  .corner.tl{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:2px 0 0 0}
  .corner.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 2px 0 0}
  .corner.bl{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 2px}
  .corner.br{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 2px 0}

  /* 灯笼 */
  .lantern{
    position:absolute;
    top:0;
    width:50px;
    transform-origin:50% 0;
    animation:swing 4.6s ease-in-out infinite;
    pointer-events:none;
    z-index:2;
  }
  .lantern.l1{left:7%;}
  .lantern.l2{right:7%;animation-duration:5.4s;animation-delay:-1.6s}
  .lantern .rope{
    display:block;
    width:1px;height:clamp(54px,11vh,120px);
    margin:0 auto;
    background:linear-gradient(180deg,rgba(242,207,125,.85),rgba(242,207,125,.25));
  }
  .lantern .body{
    position:relative;
    display:block;
    width:50px;height:62px;
    border-radius:50% / 42%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px 11px),
      radial-gradient(circle at 34% 28%, #ff9468, #d42326 52%, #7d0b0e 100%);
    border:2px solid var(--gold);
    box-shadow:0 0 26px rgba(255,142,82,.55), inset -7px -8px 18px rgba(0,0,0,.35);
    animation:glow 3.4s ease-in-out infinite;
  }
  .lantern .body::before,
  .lantern .body::after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:22px;height:6px;
    border-radius:2px;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold-deep));
  }
  .lantern .body::before{top:-5px}
  .lantern .body::after{top:auto;bottom:58px;height:5px}
  .lantern .tassel{
    display:block;
    width:2px;height:20px;
    margin:2px auto 0;
    background:linear-gradient(180deg,var(--gold),rgba(242,207,125,.15));
  }
  .lantern .tassel::after{
    content:"";
    display:block;
    width:2px;height:12px;
    margin:0 auto;
    background:linear-gradient(180deg,var(--gold),transparent);
    box-shadow:-4px 0 0 rgba(242,207,125,.7),4px 0 0 rgba(242,207,125,.7);
  }

  /* 金色粒子 */
  .particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .particles i{
    position:absolute;
    bottom:-12px;
    width:var(--s,5px);
    height:var(--s,5px);
    border-radius:50%;
    background:radial-gradient(circle, #fff6d8, rgba(242,207,125,.85) 45%, rgba(242,207,125,0) 70%);
    box-shadow:0 0 10px rgba(255,224,160,.55);
    animation:float var(--dur,16s) linear infinite;
    animation-delay:var(--delay,0s);
    opacity:0;
  }

  @keyframes swing{
    0%,100%{transform:rotate(-2.6deg)}
    50%{transform:rotate(2.6deg)}
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 22px rgba(255,142,82,.45), inset -7px -8px 18px rgba(0,0,0,.35)}
    50%{box-shadow:0 0 40px rgba(255,166,96,.7), inset -7px -8px 18px rgba(0,0,0,.3)}
  }
  @keyframes float{
    0%{transform:translate3d(0,0,0) scale(.6);opacity:0}
    12%{opacity:.85}
    80%{opacity:.6}
    100%{transform:translate3d(var(--drift,24px),-108vh,0) scale(1.15);opacity:0}
  }

  .time-inner{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:clamp(18px,4vh,56px) 22px;
    width:100%;
    max-width:640px;
  }

  .kicker{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-size:clamp(9px,1.6vw,12px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(255,230,168,.72);
  }
  .kicker .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px var(--gold);
  }
  .kicker .ceil{
    width:clamp(20px,6vw,54px);
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(242,207,125,.55));
  }

  .greeting{
    margin-top:clamp(14px,2.6vh,26px);
    font-family:var(--serif);
    font-size:clamp(14px,2.6vw,20px);
    letter-spacing:.22em;
    color:rgba(255,232,178,.86);
    text-shadow:0 2px 18px rgba(120,20,10,.45);
  }

  .date-row{
    margin-top:clamp(8px,1.6vh,18px);
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(2px,.5vw,8px);
    font-family:var(--serif);
    line-height:.95;
    color:transparent;
    background:linear-gradient(180deg,#fff8dd 0%,#ffe6a8 38%,#f2cf7d 66%,#c99a3f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    filter:drop-shadow(0 6px 20px rgba(90,10,10,.55));
  }
  .date-row .num{
    font-size:clamp(62px,15.5vw,158px);
    font-weight:600;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .date-row .unit{
    font-size:clamp(18px,4vw,38px);
    font-weight:400;
    letter-spacing:.18em;
    padding-bottom:.12em;
  }

  .week{
    margin-top:clamp(10px,1.8vh,18px);
    display:inline-flex;
    align-items:center;
    gap:12px;
    font-family:var(--serif);
    font-size:clamp(13px,2.2vw,18px);
    letter-spacing:.4em;
    color:rgba(255,232,178,.8);
  }
  .week .tip{
    display:inline-block;
    padding:3px 9px;
    border:1px solid rgba(242,207,125,.45);
    border-radius:999px;
    font-family:var(--mono);
    font-size:clamp(9px,1.4vw,11px);
    letter-spacing:.12em;
    color:rgba(255,230,168,.75);
  }

  .rule{
    display:flex;
    align-items:center;
    gap:12px;
    width:min(66%,420px);
    margin:clamp(14px,2.6vh,30px) 0 clamp(10px,2vh,22px);
    color:rgba(242,207,125,.5);
  }
  .rule::before,.rule::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(242,207,125,.5));
  }
  .rule::after{background:linear-gradient(90deg,rgba(242,207,125,.5),transparent)}
  .rule i{
    width:7px;height:7px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow:0 0 12px rgba(242,207,125,.7);
  }

  .clock{
    display:flex;
    align-items:baseline;
    justify-content:center;
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    color:var(--gold-soft);
    text-shadow:0 0 26px rgba(255,190,110,.45),0 4px 18px rgba(60,5,5,.5);
  }
  #hm{
    font-size:clamp(48px,12.5vw,124px);
    font-weight:500;
    letter-spacing:.04em;
  }
  #ss{
    font-size:clamp(20px,4.6vw,46px);
    font-weight:500;
    letter-spacing:.06em;
    color:rgba(255,230,168,.62);
    margin-left:.2em;
  }

  .auto-wrap{
    margin-top:clamp(18px,3.4vh,38px);
    width:min(78%,360px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .progress{
    width:100%;
    height:2px;
    border-radius:2px;
    background:rgba(255,230,168,.16);
    overflow:hidden;
  }
  .progress span{
    display:block;
    height:100%;
    width:100%;
    transform-origin:0 50%;
    transform:scaleX(0);
    background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));
    box-shadow:0 0 12px rgba(255,220,150,.6);
  }
  .auto-note{
    font-size:clamp(11px,1.8vw,13px);
    letter-spacing:.14em;
    color:rgba(255,232,178,.72);
  }
  .auto-note b{color:var(--gold-soft);font-weight:600}
  .tap-note{
    font-size:clamp(10px,1.6vw,12px);
    letter-spacing:.18em;
    color:rgba(255,232,178,.42);
  }

  /* ================= 第二页：内容页 ================= */
  .panel-content{
    background:var(--paper);
    background-image:
      radial-gradient(rgba(120,80,60,.055) 1px, transparent 1px),
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(242,207,125,.30), transparent 70%);
    background-size:22px 22px, 100% 100%;
    display:flex;
  }

  .topbar-accent{
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
    background:linear-gradient(90deg,#8e0f12,#c81e21 22%,#f2cf7d 50%,#c81e21 78%,#8e0f12);
    z-index:20;
  }

  .back-chip{
    position:absolute;
    top:18px;left:clamp(14px,3vw,40px);
    z-index:15;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid rgba(42,35,32,.16);
    background:rgba(255,253,248,.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:.2s;
  }
  .back-chip:hover{color:var(--red);border-color:rgba(200,30,33,.35);transform:translateY(-1px)}

  .content-scroll{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scroll-behavior:smooth;
    padding:clamp(56px,7vw,80px) clamp(16px,5vw,72px) 60px;
  }

  .board{max-width:1120px;margin:0 auto}

  .board-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    padding-bottom:clamp(16px,3vw,26px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{
    width:36px;height:36px;
    border-radius:10px;
    display:grid;place-items:center;
    background:linear-gradient(150deg,#c81e21,#8e0f12);
    color:var(--gold-soft);
    font-family:var(--serif);
    font-size:19px;
    box-shadow:0 6px 16px -8px rgba(142,15,18,.9), inset 0 0 0 1px rgba(242,207,125,.55);
  }
  .brand-name{
    font-family:var(--serif);
    font-size:16px;
    letter-spacing:.16em;
    color:var(--ink);
    line-height:1.3;
  }
  .brand-sub{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.3em;
    color:#a3988a;
    margin-top:2px;
  }
  .sync{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.04em;
  }
  .sync-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--grass);
    box-shadow:0 0 0 3px rgba(63,127,43,.14);
  }
  .sync.loading .sync-dot{
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(184,121,42,.14);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .sync.error .sync-dot{background:#b3261e;box-shadow:0 0 0 3px rgba(179,38,30,.14)}
  @keyframes pulse{50%{opacity:.35}}

  .ghost-btn{
    border:1px solid rgba(42,35,32,.16);
    background:rgba(255,253,248,.7);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.08em;
    padding:5px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .ghost-btn:hover{color:var(--red);border-color:rgba(200,30,33,.4)}

  .intro{margin-top:clamp(22px,5vw,44px)}
  .intro h1{
    font-family:var(--serif);
    font-size:clamp(28px,5.4vw,50px);
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.2;
    color:#1f1a17;
  }
  .intro h1 em{
    font-style:normal;
    color:var(--red);
    position:relative;
    isolation:isolate;
    padding:0 .04em;
  }
  .intro h1 em::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:.06em;
    height:.16em;
    background:linear-gradient(90deg,rgba(242,207,125,.85),rgba(242,207,125,0));
    z-index:-1;
  }
  .intro p{
    margin-top:12px;
    max-width:640px;
    font-size:clamp(13px,2.1vw,15px);
    line-height:1.9;
    color:var(--ink-soft);
  }
  .scroll-cue{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.22em;
    color:#b0a496;
    text-transform:uppercase;
  }
  .scroll-cue span{
    display:block;
    width:1px;height:26px;
    background:linear-gradient(180deg,transparent,#b0a496);
    animation:cue 2s ease-in-out infinite;
  }
  @keyframes cue{0%,100%{transform:translateY(-4px);opacity:.4}50%{transform:translateY(4px);opacity:1}}

  .section{margin-top:clamp(38px,7vw,72px)}
  .section-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:clamp(16px,3vw,24px);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.3em;
    color:#ab9c8b;
    text-transform:uppercase;
  }
  .section-head h2{
    margin-top:8px;
    font-family:var(--serif);
    font-size:clamp(20px,3.4vw,30px);
    font-weight:600;
    letter-spacing:.04em;
    color:#221c19;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-head h2 .bar{
    width:4px;height:clamp(17px,3vw,23px);
    border-radius:2px;
    background:linear-gradient(180deg,#c81e21,#f2cf7d);
  }
  .section-note{
    font-size:11px;
    color:#a2958a;
    letter-spacing:.06em;
    padding-bottom:3px;
  }
  .section-note a{color:var(--red);text-decoration:none;border-bottom:1px solid rgba(200,30,33,.3)}
  .section-note a:hover{border-bottom-color:var(--red)}

  /* 推荐网站 */
  .site-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
    gap:clamp(10px,1.6vw,16px);
  }
  .site-card{
    position:relative;
    display:flex;
    gap:13px;
    padding:clamp(14px,2vw,20px);
    border-radius:16px;
    background:var(--paper-2);
    border:1px solid rgba(42,35,32,.10);
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s;
  }
  .site-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(242,207,125,.16),transparent 55%);
    opacity:0;
    transition:opacity .28s;
    pointer-events:none;
  }
  .site-card:hover,.site-card:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(200,30,33,.32);
    box-shadow:0 16px 30px -18px rgba(90,10,11,.5);
    outline:none;
  }
  .site-card:hover::after{opacity:1}
  .site-mark{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:12px;
    display:grid;place-items:center;
    font-family:var(--serif);
    font-size:18px;
    color:#fff6dd;
    background:linear-gradient(150deg,#c81e21,#7d0b0e);
    box-shadow:inset 0 0 0 1px rgba(242,207,125,.4);
  }
  .site-body{min-width:0;flex:1}
  .site-name{
    display:flex;align-items:center;gap:6px;
    font-size:15px;font-weight:600;letter-spacing:.01em;color:#221c19;
  }
  .site-name .arrow{font-size:11px;color:#c9bca9;transition:.2s}
  .site-card:hover .site-name .arrow{color:var(--red);transform:translate(2px,-2px)}
  .site-url{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.02em;
    color:#b3a597;
    margin-top:3px;
  }
  .site-desc{
    display:block;
    margin-top:7px;
    font-size:12px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  /* 新闻 */
  .news-list{display:flex;flex-direction:column;gap:10px}
  .news-card{
    display:grid;
    grid-template-columns:clamp(96px,15vw,158px) 1fr;
    gap:clamp(12px,2vw,20px);
    padding:clamp(10px,1.6vw,14px);
    align-items:center;
    background:var(--paper-2);
    border:1px solid rgba(42,35,32,.10);
    border-radius:16px;
    text-decoration:none;
    color:inherit;
    transition:transform .26s,border-color .26s,box-shadow .26s;
  }
  .news-card:hover,.news-card:focus-visible{
    transform:translateY(-2px);
    border-color:rgba(200,30,33,.3);
    box-shadow:0 16px 30px -20px rgba(90,10,11,.45);
    outline:none;
  }
  .news-thumb{
    width:100%;
    aspect-ratio:16/10;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(140deg,#e8dfcd,#d8cbb4);
    position:relative;
  }
  .news-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .news-card:hover .news-thumb img{transform:scale(1.04)}
  .news-thumb:empty{display:none}
  .news-card:has(.news-thumb:empty){grid-template-columns:1fr}
  .news-body{min-width:0}
  .news-meta{
    display:flex;align-items:center;gap:9px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:#a99c8e;
  }
  .news-meta .chip{
    padding:2px 7px;
    border-radius:999px;
    background:rgba(63,127,43,.10);
    color:#3f7f2b;
    letter-spacing:.04em;
  }
  .news-meta .chip.snap{background:rgba(184,121,42,.12);color:#a06a25}
  .news-body h3{
    margin-top:6px;
    font-size:clamp(14px,2.2vw,17px);
    font-weight:600;
    line-height:1.45;
    color:#221c19;
  }
  .news-body p{
    margin-top:5px;
    font-size:12px;
    line-height:1.75;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* 版本 */
  .version-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(10px,1.6vw,16px);
  }
  .version-card{
    position:relative;
    padding:clamp(16px,2.6vw,24px);
    border-radius:18px;
    background:var(--paper-2);
    border:1px solid rgba(42,35,32,.10);
    overflow:hidden;
  }
  .version-card .vtop{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .vtype{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    background:rgba(63,127,43,.10);
    color:#3a7427;
  }
  .vtype.snapshot{background:rgba(184,121,42,.12);color:#9d6824}
  .vdate{font-family:var(--mono);font-size:10px;color:#a99c8e;letter-spacing:.06em}
  .version-card .vnum{
    margin-top:14px;
    font-family:var(--serif);
    font-size:clamp(30px,5.6vw,44px);
    line-height:1.1;
    letter-spacing:.01em;
    color:#1f1a17;
    word-break:break-word;
  }
  .version-card .vnote{
    margin-top:10px;
    font-size:12px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .version-card::before{
    content:"";
    position:absolute;
    right:-30px;bottom:-30px;
    width:120px;height:120px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(242,207,125,.28),transparent 70%);
    pointer-events:none;
  }

  .vlist{margin-top:clamp(14px,2.4vw,22px);border-top:1px solid var(--line)}
  .vrow{
    display:grid;
    grid-template-columns:110px 1fr auto;
    align-items:center;
    gap:10px;
    padding:11px 2px;
    border-bottom:1px solid rgba(42,35,32,.07);
    font-size:12px;
  }
  .vrow .vtag{
    justify-self:start;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:2px 8px;
    border-radius:999px;
    background:rgba(63,127,43,.10);
    color:#3a7427;
  }
  .vrow .vtag.snapshot{background:rgba(184,121,42,.12);color:#9d6824}
  .vrow .vtag.other{background:rgba(42,35,32,.07);color:#8b8076}
  .vrow .vid{font-family:var(--mono);font-size:12px;color:#332b26;letter-spacing:.02em}
  .vrow .vtime{font-family:var(--mono);font-size:10px;color:#b0a496}

  .changelog{margin-top:clamp(22px,3.4vw,32px)}
  .changelog-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#ab9c8b;
    margin-bottom:10px;
  }
  .log-item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px 16px;
    padding:12px 0;
    border-bottom:1px dashed rgba(42,35,32,.14);
    align-items:baseline;
  }
  .log-item .ltitle{font-size:13px;font-weight:600;color:#2a221e}
  .log-item .ldate{font-family:var(--mono);font-size:10px;color:#b0a496}
  .log-item .ltext{
    grid-column:1/-1;
    font-size:12px;
    line-height:1.7;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* 骨架 / 错误 */
  .skel{position:relative;overflow:hidden;background:rgba(42,35,32,.06);border-radius:10px}
  .skel::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:shimmer 1.4s infinite;
    transform:translateX(-100%);
  }
  @keyframes shimmer{100%{transform:translateX(100%)}}
  .skel-card{
    height:86px;border-radius:16px;background:rgba(42,35,32,.05);
    border:1px solid rgba(42,35,32,.06);
    position:relative;overflow:hidden;
  }
  .skel-card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    animation:shimmer 1.4s infinite;transform:translateX(-100%);
  }
  .skel-stack{display:flex;flex-direction:column;gap:10px}

  .error-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    padding:18px 20px;
    border-radius:16px;
    border:1px dashed rgba(179,38,30,.35);
    background:rgba(255,253,248,.7);
  }
  .error-box p{font-size:12px;line-height:1.7;color:var(--ink-soft);max-width:520px}
  .error-box strong{display:block;color:#a12a22;font-size:13px;margin-bottom:3px}
  .retry-btn{
    border:0;
    background:linear-gradient(150deg,#c81e21,#8e0f12);
    color:#fff4dc;
    font-size:12px;
    letter-spacing:.1em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 20px -12px rgba(142,15,18,.9);
  }
  .retry-btn:hover{filter:brightness(1.08)}

  .foot{
    margin-top:clamp(40px,7vw,72px);
    padding-top:18px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    font-size:10px;
    letter-spacing:.08em;
    color:#b0a496;
    font-family:var(--mono);
  }
  .foot span:last-child{color:#c3b7a8}

  /* ---------- 响应式 ---------- */
  @media (max-width:760px){
    .content-scroll{padding:58px 16px 46px}
    .board-head{padding-bottom:14px}
    .news-card{grid-template-columns:88px 1fr;gap:11px}
    .version-grid{grid-template-columns:1fr}
    .vrow{grid-template-columns:88px 1fr auto;gap:8px}
    .lantern .body{width:40px;height:50px}
    .lantern{width:40px}
    .corner{width:38px;height:38px}
    .sync .sync-text{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
  @media (max-width:520px){
    .lantern.l1{left:4%}
    .lantern.l2{right:4%}
    .intro h1{letter-spacing:0}
    .site-grid{grid-template-columns:1fr}
    .site-desc{font-size:12px}
    .news-card{grid-template-columns:78px 1fr}
    .news-body p{-webkit-line-clamp:2}
    .section-note{display:none}
  }
  @media (max-height:620px){
    .date-row .num{font-size:clamp(44px,12vh,96px)}
    #hm{font-size:clamp(38px,10vh,84px)}
    .rule{margin:10px 0}
    .greeting{margin-top:8px}
  }
  @media (prefers-reduced-motion:reduce){
    .stage{transition-duration:.01ms}
    .lantern,.particles i,.scroll-cue span,.sync.loading .sync-dot{animation:none}
    .particles i{display:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- ============ 第一页 ============ -->
  <section class="panel panel-time" id="timePanel" role="button" tabindex="0" aria-label="当前时间，点击进入今日内容">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="lantern l1" aria-hidden="true">
      <span class="rope"></span><span class="body"></span><span class="tassel"></span>
    </div>
    <div class="lantern l2" aria-hidden="true">
      <span class="rope"></span><span class="body"></span><span class="tassel"></span>
    </div>

    <div class="time-inner">
      <div class="kicker">
        <span class="dot"></span>
        <span>TODAY</span>
        <span class="ceil"></span>
        <span id="year">2026</span>
      </div>

      <div class="greeting" id="greeting">晚上好，愿今天顺遂</div>

      <div class="date-row">
        <span class="num" id="month">11</span><span class="unit">月</span>
        <span class="num" id="day">06</span><span class="unit">日</span>
      </div>

      <div class="week">
        <span id="weekday">星期四</span>
        <span class="tip" id="weektip">W45</span>
      </div>

      <div class="rule" aria-hidden="true"><i></i></div>

      <div class="clock" aria-live="off">
        <span id="hm">20:30</span><span id="ss">:15</span>
      </div>

      <div class="auto-wrap">
        <div class="progress" aria-hidden="true"><span id="bar"></span></div>
        <p class="auto-note"><b id="count">6</b> </p>
        <p class="tap-note">点击任意处 或 上滑，立即进入</p>
      </div>
    </div>
  </section>

  <!-- ============ 第二页 ============ -->
  <section class="panel panel-content" id="contentPanel" aria-hidden="true">
    <div class="topbar-accent"></div>
    <button class="back-chip" id="backBtn" type="button" aria-label="回到时间页">← 时间页</button>

    <div class="content-scroll" id="scroller">
      <div class="board">

        <header class="board-head">
          <div class="brand">
            <span class="brand-mark">今</span>
            <div>
              <div class="brand-name">今日首页</div>
              <div class="brand-sub">TODAY BOARD</div>
            </div>
          </div>
          <div class="sync loading" id="sync">
            <span class="sync-dot"></span>
            <span class="sync-text" id="syncText">同步中…</span>
            <button class="ghost-btn" id="refreshBtn" type="button">刷新</button>
          </div>
        </header>

        <div class="intro">
          <h1>向下滑动，看看<em>今天</em>的内容</h1>
          <p> </p>
          <div class="scroll-cue"><span></span>向下滚动</div>
        </div>

        <!-- 推荐网站 -->
        <section class="section" id="sites">
          <div class="section-head">
            <div>
              <div class="eyebrow">01 / Weekly Picks</div>
              <h2><span class="bar"></span>推荐网站(站长mc服务器frp-oak.com:20428)</h2>
            </div>
            <div class="section-note"> </div>
          </div>
          <div class="site-grid" id="siteGrid"></div>
        </section>

        <!-- Minecraft 新闻 -->
        <section class="section" id="news">
          <div class="section-head">
            <div>
              <div class="eyebrow">02 / Minecraft News</div>
              <h2><span class="bar"></span>最近新闻</h2>
            </div>
            <div class="section-note"><a href="https://www.minecraft.net/en-us/news" target="_blank" rel="noopener noreferrer">查看全部 ↗</a></div>
          </div>
          <div class="skel-stack" id="newsList" aria-live="polite">
            <div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div>
          </div>
        </section>

        <!-- 最新版本 -->
        <section class="section" id="versions">
          <div class="section-head">
            <div>
              <div class="eyebrow">03 / Versions</div>
              <h2><span class="bar"></span>最新版本</h2>
            </div>
            <div class="section-note">Java 版 · 数据来自 Mojang</div>
          </div>

          <div class="version-grid" id="versionGrid">
            <div class="skel-card"></div><div class="skel-card"></div>
          </div>

          <div class="vlist" id="versionList"></div>

          <div class="changelog">
            <div class="changelog-head">
              <span>Java Edition · 更新摘要</span>
              <span>最近 4 条</span>
            </div>
            <div id="changelogList"></div>
          </div>
        </section>

        <footer class="foot">
          <span>数据来源：Mojang 公开接口 · 每次打开自动同步</span>
          <span id="lastSync">—</span>
        </footer>

      </div>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* ================= 基础配置 ================= */
  var AUTO_SECONDS = 6;
  var NEWS_API = 'https://launchercontent.mojang.com/v2/news.json';
  var PATCH_API = 'https://launchercontent.mojang.com/v2/javaPatchNotes.json';
  var VERSION_API = 'https://launchermeta.mojang.com/mc/game/version_manifest_v2.json';
  var IMG_BASE = 'https://launchercontent.mojang.com';
  var CACHE_KEY = 'today_board_mc_v1';

  var SITE_LIST = [
    { name:'Minecraft 官网', url:'https://www.minecraft.net/zh-hans', host:'minecraft.net', mark:'M', desc:'官方资讯、版本说明与 Java / 基岩版购买入口。' },
    { name:'Minecraft Wiki', url:'https://zh.minecraft.wiki/', host:'zh.minecraft.wiki', mark:'W', desc:'中文百科，合成表、生物习性与机制细节都能查到。' },
    { name:'Modrinth', url:'https://modrinth.com/', host:'modrinth.com', mark:'R', desc:'现代开源模组与整合包平台，下载干净、版本筛选清晰。' },
    { name:'CurseForge', url:'https://www.curseforge.com/minecraft', host:'curseforge.com', mark:'C', desc:'老牌资源站，模组、地图、材质与整合包数量庞大。' },
    { name:'Hypixel', url:'https://hypixel.net/', host:'hypixel.net', mark:'H', desc:'Java 版人气小游戏服务器，起床战争与空岛战争常青。' },
    { name:'Planet Minecraft', url:'https://www.planetminecraft.com/', host:'planetminecraft.com', mark:'P', desc:'建筑、皮肤与地图创作社区，适合找灵感与素材。' }
  ];

  var WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var MONTH_CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  /* ================= DOM ================= */
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  var timePanel = $('timePanel');
  var contentPanel = $('contentPanel');
  var scroller = $('scroller');
  var monthEl = $('month'), dayEl = $('day'), weekdayEl = $('weekday'), weektipEl = $('weektip');
  var yearEl = $('year'), greetingEl = $('greeting'), hmEl = $('hm'), ssEl = $('ss');
  var countEl = $('count'), barEl = $('bar');
  var syncEl = $('sync'), syncTextEl = $('syncText'), lastSyncEl = $('lastSync');
  var newsListEl = $('newsList'), versionGridEl = $('versionGrid'), versionListEl = $('versionList'), changelogEl = $('changelogList');

  /* ================= 工具函数 ================= */
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function imgUrl(u) {
    if (!u) return '';
    return /^http/i.test(u) ? u : IMG_BASE + u;
  }

  function cleanLink(u) {
    if (!u) return 'https://www.minecraft.net/en-us/news';
    return u.replace(/([?&])OCID=[^&]*/g, '').replace(/[?&]$/, '');
  }

  function fmtDate(input, withYear) {
    if (!input) return '';
    var d = new Date(input);
    if (isNaN(d.getTime())) return '';
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    return (withYear ? y + '.' : '') + pad(m) + '.' + pad(day);
  }

  function fmtTime(d) {
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function isoWeek(d) {
    var t = new Date(d.getTime());
    t.setHours(0, 0, 0, 0);
    t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7);
    var first = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - first) / 86400000 - 3 + (first.getDay() + 6) % 7) / 7);
  }

  /* ================= 时钟 ================= */
  function tickClock() {
    var now = new Date();
    var h = now.getHours();
    monthEl.textContent = now.getMonth() + 1;
    dayEl.textContent = pad(now.getDate());
    weekdayEl.textContent = WEEK_CN[now.getDay()];
    weektipEl.textContent = 'W' + pad(isoWeek(now));
    yearEl.textContent = now.getFullYear();
    hmEl.textContent = pad(h) + ':' + pad(now.getMinutes());
    ssEl.textContent = ':' + pad(now.getSeconds());

    var greet;
    if (h < 5) greet = '夜深了，早点休息';
    else if (h < 8) greet = '清晨好，今天从一杯热茶开始';
    else if (h < 11) greet = '上午好，愿今天顺遂';
    else if (h < 14) greet = '中午好，记得按时吃饭';
    else if (h < 18) greet = '下午好，慢一点也没关系';
    else if (h < 23) greet = '晚上好，愿今天顺遂';
    else greet = '夜深了，早点休息';
    greetingEl.textContent = greet;
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ================= 金色粒子 ================= */
  (function makeParticles() {
    var box = $('particles');
    var n = window.innerWidth < 640 ? 16 : 28;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var p = document.createElement('i');
      var size = 2 + Math.random() * 5;
      p.style.left = (Math.random() * 100).toFixed(2) + '%';
      p.style.setProperty('--s', size.toFixed(1) + 'px');
      p.style.setProperty('--dur', (12 + Math.random() * 12).toFixed(1) + 's');
      p.style.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');
      p.style.setProperty('--drift', ((Math.random() - 0.5) * 90).toFixed(0) + 'px');
      frag.appendChild(p);
    }
    box.appendChild(frag);
  })();

  /* ================= 翻页控制 ================= */
  var shifted = false;
  var autoTimer = null;
  var tickTimer = null;

  function clearAuto() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function restartBar() {
    barEl.style.animation = 'none';
    void barEl.offsetWidth;
    barEl.style.animation = 'barfill ' + AUTO_SECONDS + 's linear forwards';
  }

  // 进度条关键帧用 JS 注入，避免每次重建样式表
  var styleTag = document.createElement('style');
  styleTag.textContent = '@keyframes barfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}';
  document.head.appendChild(styleTag);

  function goContent() {
    if (shifted) return;
    clearAuto();
    shifted = true;
    body.classList.add('shifted');
    contentPanel.setAttribute('aria-hidden', 'false');
    timePanel.setAttribute('aria-hidden', 'true');
    timePanel.setAttribute('tabindex', '-1');
    scroller.scrollTop = 0;
    // 让内容页获得焦点，方便键盘继续滚动
    try { scroller.focus({ preventScroll: true }); } catch (e) {}
  }

  function goBack() {
    if (!shifted) return;
    shifted = false;
    clearAuto();
    body.classList.remove('shifted');
    contentPanel.setAttribute('aria-hidden', 'true');
    timePanel.setAttribute('aria-hidden', 'false');
    timePanel.setAttribute('tabindex', '0');
    countEl.textContent = AUTO_SECONDS;
    barEl.style.animation = 'none';
  }

  function startAuto() {
    clearAuto();
    var left = AUTO_SECONDS;
    countEl.textContent = left;
    restartBar();
    tickTimer = setInterval(function () {
      left -= 1;
      countEl.textContent = Math.max(left, 0);
    }, 1000);
    autoTimer = setTimeout(goContent, AUTO_SECONDS * 1000);
  }

  timePanel.addEventListener('click', goContent);
  timePanel.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); goContent(); }
  });
  $('backBtn').addEventListener('click', function (e) { e.stopPropagation(); goBack(); });

  window.addEventListener('wheel', function (e) {
    if (!shifted && e.deltaY > 6) goContent();
  }, { passive: true });

  var touchStartY = 0, touchStartX = 0;
  timePanel.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStartY = t.clientY; touchStartX = t.clientX;
  }, { passive: true });
  timePanel.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dy = touchStartY - t.clientY;
    var dx = touchStartX - t.clientX;
    if (dy > 40 || dx > 50) goContent();
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    if (!shifted && (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ')) {
      e.preventDefault(); goContent();
    }
  });

  /* ================= 渲染：推荐网站 ================= */
  function renderSites() {
    $('siteGrid').innerHTML = SITE_LIST.map(function (s) {
      return '<a class="site-card" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="site-mark">' + esc(s.mark) + '</span>' +
        '<span class="site-body">' +
          '<span class="site-name">' + esc(s.name) + '<span class="arrow">↗</span></span>' +
          '<span class="site-url">' + esc(s.host) + '</span>' +
          '<span class="site-desc">' + esc(s.desc) + '</span>' +
        '</span>' +
      '</a>';
    }).join('');
  }

  /* ================= 渲染：新闻 ================= */
  function renderNews(entries) {
    if (!entries || !entries.length) {
      newsListEl.innerHTML = errorBox('暂时没有拿到新闻', 'Mojang 接口没有返回内容，可以点刷新再试。');
      return;
    }

    var sorted = entries.slice().sort(function (a, b) {
      return (new Date(b.date) - new Date(a.date)) || 0;
    }).slice(0, 6);

    newsListEl.className = 'news-list';
    newsListEl.innerHTML = sorted.map(function (n) {
      var img = (n.newsPageImage && n.newsPageImage.url) || (n.playPageImage && n.playPageImage.url) || '';
      var isSnap = /snapshot|Snapshot/.test(n.title || '') || (n.newsType && n.newsType.join(' ').indexOf('Snapshot') >= 0);
      var cat = n.category || 'Minecraft';
      return '<a class="news-card" href="' + esc(cleanLink(n.readMoreLink)) + '" target="_blank" rel="noopener noreferrer">' +
        (img ? '<span class="news-thumb"><img src="' + esc(imgUrl(img)) + '" alt="" loading="lazy" decoding="async" onerror="this.closest(\'.news-card\').style.gridTemplateColumns=\'1fr\';this.parentNode.style.display=\'none\'"></span>' : '<span class="news-thumb"></span>') +
        '<span class="news-body">' +
          '<span class="news-meta">' +
            '<span class="chip' + (isSnap ? ' snap' : '') + '">' + esc(cat) + '</span>' +
            '<time>' + esc(fmtDate(n.date, true)) + '</time>' +
          '</span>' +
          '<h3>' + esc(n.title || '未命名更新') + '</h3>' +
          '<p>' + esc(n.text || '') + '</p>' +
        '</span>' +
      '</a>';
    }).join('');
  }

  /* ================= 渲染：版本 ================= */
  function findVersion(versions, id) {
    if (!id) return null;
    for (var i = 0; i < versions.length; i++) {
      if (versions[i].id === id) return versions[i];
    }
    return null;
  }

  function typeLabel(type) {
    return type === 'release' ? '正式版' : type === 'snapshot' ? '快照' : type === 'old_beta' ? '旧测试版' : '旧版本';
  }

  function typeClass(type) {
    return type === 'release' ? '' : type === 'snapshot' ? ' snapshot' : ' other';
  }

  function renderVersions(manifest) {
    var versions = (manifest && manifest.versions) || [];
    var latest = (manifest && manifest.latest) || {};
    if (!versions.length) {
      versionGridEl.innerHTML = errorBox('版本信息获取失败', '未能读取 Mojang 版本清单。');
      versionListEl.innerHTML = '';
      return;
    }

    var release = findVersion(versions, latest.release) || versions[0];
    var snapshot = findVersion(versions, latest.snapshot);

    var cards = '';
    if (release) {
      cards += '<div class="version-card">' +
        '<div class="vtop"><span class="vtype">正式版 · Release</span><span class="vdate">' + esc(fmtDate(release.releaseTime, true)) + '</span></div>' +
        '<div class="vnum">' + esc(release.id) + '</div>' +
        '<div class="vnote">当前 Java 版正式版本，启动器会自动更新到这里。</div>' +
      '</div>';
    }
    if (snapshot) {
      cards += '<div class="version-card">' +
        '<div class="vtop"><span class="vtype snapshot">快照 · Snapshot</span><span class="vdate">' + esc(fmtDate(snapshot.releaseTime, true)) + '</span></div>' +
        '<div class="vnum">' + esc(snapshot.id) + '</div>' +
        '<div class="vnote">开发中的预览版本，适合提前体验新内容。</div>' +
      '</div>';
    }
    versionGridEl.innerHTML = cards;

    versionListEl.innerHTML = '<div class="vrow" style="font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#b0a496;text-transform:uppercase">' +
        '<span>类型</span><span>版本号</span><span>发布时间</span></div>' +
      versions.slice(0, 6).map(function (v) {
        return '<div class="vrow">' +
          '<span class="vtag' + typeClass(v.type) + '">' + esc(typeLabel(v.type)) + '</span>' +
          '<span class="vid">' + esc(v.id) + '</span>' +
          '<span class="vtime">' + esc(fmtDate(v.releaseTime, true)) + '</span>' +
        '</div>';
      }).join('');
  }

  /* ================= 渲染：更新摘要 ================= */
  function renderPatch(entries) {
    if (!entries || !entries.length) {
      changelogEl.innerHTML = '<div class="error-box"><p>更新摘要暂时不可用，稍后点刷新试试。</p></div>';
      return;
    }
    changelogEl.innerHTML = entries.slice(0, 4).map(function (p) {
      return '<div class="log-item">' +
        '<span class="ltitle">' + esc(p.title || p.version || '') + '</span>' +
        '<span class="ldate">' + esc(fmtDate(p.date, true)) + '</span>' +
        '<span class="ltext">' + esc(p.shortText || '') + '</span>' +
      '</div>';
    }).join('');
  }

  function errorBox(title, text) {
    return '<div class="error-box"><p><strong>' + esc(title) + '</strong>' + esc(text) + '</p>' +
      '<button class="retry-btn" type="button" onclick="location.reload()">重新加载</button></div>';
  }

  /* ================= 数据同步 ================= */
  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.ts) return null;
      return data;
    } catch (e) { return null; }
  }

  function writeCache(data) {
    try {
      data.ts = Date.now();
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function setSync(state, text) {
    syncEl.className = 'sync' + (state ? ' ' + state : '');
    syncTextEl.textContent = text;
  }

  function renderAll(data, ts) {
    if (data.news) renderNews(data.news);
    if (data.manifest) renderVersions(data.manifest);
    if (data.patch) renderPatch(data.patch);
    lastSyncEl.textContent = '最后同步 ' + (ts ? new Date(ts).toLocaleTimeString('zh-CN', { hour12: false }) : '—');
  }

  function fetchJSON(url) {
    return fetch(url, {
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function loadData() {
    setSync('loading', '同步中…');
    var cached = readCache();
    if (cached) renderAll(cached, cached.ts);

    Promise.allSettled([fetchJSON(NEWS_API), fetchJSON(VERSION_API), fetchJSON(PATCH_API)])
    .then(function (results) {
      var ok = 0, next = {};
      var get = function (r) {
        if (r && r.status === 'fulfilled' && r.value) { ok++; return r.value; }
        return null;
      };
      var newsRes = get(results[0]);
      var verRes = get(results[1]);
      var patchRes = get(results[2]);

      next.news = (newsRes && newsRes.entries) ? newsRes.entries : (cached && cached.news) || null;
      next.manifest = verRes || (cached && cached.manifest) || null;
      next.patch = (patchRes && patchRes.entries) ? patchRes.entries : (cached && cached.patch) || null;

      if (ok > 0) {
        writeCache({
          news: next.news, manifest: next.manifest, patch: next.patch, ts: Date.now()
        });
        renderAll(next, Date.now());
        setSync('', ok === 3 ? '已同步官方数据' : '已同步 · 部分接口未响应');
        lastSyncEl.textContent = '最后同步 ' + fmtTime(new Date());
      } else if (cached) {
        renderAll(cached, cached.ts);
        setSync('error', '网络不可用 · 展示缓存');
      } else {
        setSync('error', '同步失败 · 请检查网络');
        if (!next.news) renderNews([]);
        if (!next.manifest) renderVersions(null);
        if (!next.patch) renderPatch([]);
      }
    })
    .catch(function () {
      setSync('error', '同步失败 · 请检查网络');
      if (cached) renderAll(cached, cached.ts);
      else { renderNews([]); renderVersions(null); renderPatch([]); }
    });
  }

  /* ================= 启动 ================= */
  renderSites();
  startAuto();
  loadData();

  $('refreshBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    loadData();
  });

  // 页面重新可见时，如果超过 15 分钟就静默更新一次
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 15 * 60 * 1000) loadData();
  });


})();
</script>
</body>
</html>
