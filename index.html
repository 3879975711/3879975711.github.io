<html lang="zh-CN" data-trae-theme="light"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      color: #222;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .topbar {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 10px 20px;
      border-bottom: 1px solid #eee;
      background: #fff;
    }

    .topbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .room-hint {
      display: none;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .current-name {
      max-width: 140px;
      overflow: hidden;
      color: #666;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .text-button {
      padding: 4px;
      border: 0;
      color: #666;
      background: transparent;
      font-size: 13px;
    }

    .text-button:hover {
      color: #111;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      background: #fff;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin-top: 30vh;
      color: #a0a0a0;
      font-size: 14px;
      text-align: center;
    }

    .time-divider,
    .system-message {
      margin: 15px 0;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
    }

    .message-row.own {
      flex-direction: row-reverse;
    }

    .avatar {
      display: none;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: min(72%, 560px);
      min-width: 0;
    }

    .own .message-content {
      align-items: flex-end;
    }

    .sender-name {
      margin: 0 0 4px 2px;
      color: #888;
      font-size: 12px;
    }

    .bubble {
      max-width: 100%;
      padding: 8px 11px;
      border-radius: 5px;
      background: #f3f3f3;
      font-size: 15px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .own .bubble {
      color: #fff;
      background: #222;
    }

    .own .image-bubble {
      background: #f3f3f3;
    }

    .image-bubble {
      padding: 3px;
      line-height: 0;
    }

    .message-image {
      display: block;
      width: auto;
      max-width: min(260px, 60vw);
      max-height: 320px;
      border-radius: 3px;
      cursor: zoom-in;
      object-fit: contain;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      color: #a0a0a0;
      font-size: 11px;
    }

    .recall-button {
      padding: 0;
      border: 0;
      color: #888;
      background: transparent;
      font-size: 11px;
      opacity: 0;
    }

    .message-row:hover .recall-button,
    .recall-button:focus-visible {
      opacity: 1;
    }

    .recall-button:hover {
      color: #333;
      text-decoration: underline;
    }

    .composer {
      flex-shrink: 0;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    .preview-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 3px 4px 11px;
    }

    .preview-item {
      position: relative;
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      border: 1px solid #d4d4d4;
      border-radius: 4px;
      object-fit: cover;
    }

    .remove-preview {
      position: absolute;
      top: -6px;
      right: -6px;
      display: grid;
      width: 20px;
      height: 20px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      font-size: 15px;
      line-height: 1;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .image-button {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 4px;
      color: #555;
      background: transparent;
    }

    .image-button:hover {
      background: #e8e8e8;
    }

    .image-button svg {
      width: 23px;
      height: 23px;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 11px;
      resize: none;
      border: 1px solid transparent;
      border-radius: 4px;
      outline: none;
      background: #f3f3f3;
      font-size: 15px;
      line-height: 20px;
    }

    .message-input:focus {
      border-color: #ddd;
    }

    .send-button {
      flex: 0 0 64px;
      height: 40px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: #222;
      font-size: 14px;
    }

    .send-button:hover:not(:disabled) {
      background: #000;
    }

    .send-button:disabled {
      color: #aaa;
      background: #eee;
      cursor: default;
    }

    .composer-hint {
      display: none;
    }

    dialog {
      padding: 0;
      border: 0;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.38);
    }

    .profile-dialog {
      width: min(88vw, 360px);
      padding: 24px;
      border-radius: 8px;
      background: #fff;
    }

    .profile-dialog h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .profile-description {
      margin: 9px 0 18px;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
    }

    .profile-dialog label {
      display: block;
      margin-bottom: 7px;
      color: #555;
      font-size: 13px;
    }

    .name-input {
      width: 100%;
      height: 42px;
      padding: 0 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-size: 15px;
    }

    .name-input:focus {
      border-color: #777;
    }

    .form-error {
      min-height: 18px;
      margin: 6px 0 0;
      color: #c94141;
      font-size: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 16px;
    }

    .dialog-actions button {
      min-width: 68px;
      height: 36px;
      border-radius: 4px;
      font-size: 14px;
    }

    .cancel-button {
      border: 1px solid #ccc;
      background: #fff;
    }

    .confirm-button {
      border: 1px solid #222;
      color: #fff;
      background: #222;
    }

    .image-viewer {
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      background: #151515;
    }

    .image-viewer::backdrop {
      background: #151515;
    }

    .viewer-body {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
    }

    .viewer-body img {
      max-width: 94vw;
      max-height: 92dvh;
      object-fit: contain;
    }

    .close-viewer {
      position: fixed;
      top: 16px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      font-size: 25px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      z-index: 20;
      bottom: 110px;
      left: 50%;
      max-width: 80vw;
      padding: 9px 15px;
      transform: translateX(-50%);
      border-radius: 4px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .messages {
        padding-right: 12px;
        padding-left: 12px;
      }

      .message-content {
        max-width: 78%;
      }

      .composer-hint {
        display: none;
      }

      .composer {
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
    }

    @media (hover: none) {
      .recall-button {
        opacity: 1;
      }
    }
  </style>

@keyframes trae-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes trae-edit-bar-enter {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes trae-edit-bar-leave {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  to {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

@keyframes trae-edit-panel-leave {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  to {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

.trae-edit-mode-active:not(.trae-edit-mode-dragging) body *:not([data-trae-edit-ui]):not([data-trae-edit-ui] *) {
  transition: none !important;
  animation-play-state: paused !important;
}

.trae-edit-mode-reorder-hit-test [data-trae-edit-ui]:not(.trae-edit-pointer-shield):not(.trae-edit-panel),
.trae-edit-mode-reorder-hit-test [data-trae-edit-ui]:not(.trae-edit-pointer-shield):not(.trae-edit-panel) * {
  pointer-events: none !important;
}

.trae-browser-inspect-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: var(--trae-layer-browser-inspect-overlay);
  pointer-events: auto;
  background: transparent;
}

.trae-browser-inspect-highlight-box {
  position: absolute;
  top: 0;
  left: 0;
  z-index: var(--trae-layer-browser-inspect-highlight);
  display: none;
}

.trae-browser-inspect-highlight-tag {
  position: absolute;
  left: 0px;
  top: 0px;
  height: 18px;
  padding: 0 6px;
  box-sizing: border-box;
  border-radius: 4px;
  background-color: var(--trae-status-success-default);
  color: var(--trae-text-onaccent);
  font-size: 12px;
  font-weight: 400;
  display: none;
  align-items: center;
  z-index: var(--trae-layer-browser-inspect-action);
}

.trae-browser-inspect-highlight-box-show {
  display: flex;
}

.trae-browser-inspect-highlight-tag.trae-browser-inspect-highlight-box-show {
  display: none;
}

.trae-browser-inspect-select-button.trae-browser-inspect-highlight-box-show {
  display: block !important;
}

.trae-browser-inspect-select-button {
  position: absolute;
  top: 0;
  left: 0;
  display: none;
  z-index: var(--trae-layer-browser-inspect-action);
}

.trae-browser-inspect-select-highlight-box {
  background: transparent !important;
}

.trae-browser-inspect-select-highlight-box .trae-browser-inspect-highlight-tag {
  background-color: var(--trae-status-success-default);
}

.trae-add-to-chat-card {
  display: block;
  overflow: hidden;
  background: var(--trae-bg-menu);
  border: 1px solid var(--trae-border-l1);
  border-radius: 8px;
  box-shadow: var(--trae-floating-shadow);
  transition:
    width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
    height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.trae-add-to-chat-content {
  position: relative;
  width: max-content;
}

.trae-fade-exit {
  opacity: 0;
  transition: opacity 0.15s ease-out;
}

.trae-fade-enter {
  opacity: 1;
  transition: opacity 0.2s ease-in;
}

.trae-buttons-view {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px;
  background: transparent;
}

.trae-action-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: transparent;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transform: none !important;
  transition: none !important;
  animation: none !important;
}

.trae-action-button:hover {
  background: var(--trae-bg-overlay-l2);
}

.trae-action-button:active {
  background: var(--trae-bg-overlay-l3);
}

.trae-action-button:focus-visible {
  outline: 2px solid var(--trae-status-primary);
  outline-offset: 1px;
}

.trae-action-button-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--trae-icon-default);
  flex-shrink: 0;
}

.trae-action-button-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 11px;
  font-weight: 500;
  line-height: 16px;
  color: var(--trae-text-default);
  white-space: nowrap;
}

.trae-edit-toolbar-button-active {
  background: var(--bg-bg-brand-disabled, rgba(75, 63, 227, 0.22)) !important;
  color: var(--icon-icon-brand, #4b3fe3) !important;

<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>.</h1>
        <p class="room-hint">78</p>
      </div>
      <div class="profile-actions">
        <span class="current-name" id="currentName"></span>
        <button class="text-button" id="renameButton" type="button">改名</button>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite"><div class="empty-state">还没有消息，说点什么吧。</div></main>

    <footer class="composer">
      <div class="preview-list" id="previewList" hidden=""></div>
      <div class="input-row">
        <label class="image-button" title="发送图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="8.5" cy="9" r="1.5"></circle>
            <path d="m4 17 5-5 4 4 2-2 5 4"></path>
          </svg>
          <input id="imageInput" type="file" accept="image/*" multiple="" hidden="">
        </label>
        <textarea class="message-input" id="messageInput" rows="1" maxlength="2000" placeholder="输入消息" aria-label="消息内容"></textarea>
        <button class="send-button" id="sendButton" type="button" disabled="">发送</button>
      </div>
      <div class="composer-hint">Enter 发送，Shift + Enter 换行</div>
    </footer>
  </div>

  <dialog class="profile-dialog" id="profileDialog" open="">
    <form id="profileForm">
      <h2 id="profileTitle">进入</h2>
      <p class="profile-description" id="profileDescription">留个名字</p>
      <label for="nameInput">your name</label>
      <input class="name-input" id="nameInput" maxlength="12" autocomplete="nickname" placeholder="怎么称呼你？">
      <p class="form-error" id="nameError"></p>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelRename" type="button" hidden="">取消</button>
        <button class="confirm-button" id="profileConfirm" type="submit">进入</button>
      </div>
    </form>
  </dialog>

    <div class="viewer-body">
      <img id="viewerImage" alt="查看大图">
    </div>
    <button class="close-viewer" id="closeViewer" type="button" aria-label="关闭">×</button>
  </dialog>

  <div class="toast" id="toast" role="status" hidden=""></div>

  <script>
    (() => {
      "use strict";

      const MESSAGE_KEY = "simple_chat_messages_v1";
      const PROFILE_KEY = "simple_chat_profile_v1";
      const MAX_MESSAGES = 100;
      const MAX_IMAGES = 6;

      const messagesElement = document.getElementById("messages");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const imageInput = document.getElementById("imageInput");
      const previewList = document.getElementById("previewList");
      const currentName = document.getElementById("currentName");
      const renameButton = document.getElementById("renameButton");
      const profileDialog = document.getElementById("profileDialog");
      const profileForm = document.getElementById("profileForm");
      const profileTitle = document.getElementById("profileTitle");
      const profileDescription = document.getElementById("profileDescription");
      const profileConfirm = document.getElementById("profileConfirm");
      const cancelRename = document.getElementById("cancelRename");
      const nameInput = document.getElementById("nameInput");
      const nameError = document.getElementById("nameError");
      const imageViewer = document.getElementById("imageViewer");
      const viewerImage = document.getElementById("viewerImage");
      const closeViewer = document.getElementById("closeViewer");
      const toast = document.getElementById("toast");

      let profile = readJSON(sessionStorage, PROFILE_KEY);
      let messages = readJSON(localStorage, MESSAGE_KEY) || [];
      let pendingImages = [];
      let toastTimer;
      let sending = false;

      const channel = "BroadcastChannel" in window
        ? new BroadcastChannel("simple_local_chat")
        : null;

      function readJSON(storage, key) {
        try {
          const value = storage.getItem(key);
          return value ? JSON.parse(value) : null;
        } catch {
          return null;
        }
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        toast.textContent = text;
        toast.hidden = false;
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2400);
      }

      function saveMessages() {
        try {
          localStorage.setItem(MESSAGE_KEY, JSON.stringify(messages));
          return true;
        } catch {
          showToast("浏览器存储空间不足，可以清理一些旧聊天记录");
          return false;
        }
      }

      function notifyOtherTabs() {
        if (channel) {
          channel.postMessage({ type: "refresh" });
        }
      }

      function twoDigits(number) {
        return String(number).padStart(2, "0");
      }

      function shortTime(timestamp) {
        const date = new Date(timestamp);
        return `${twoDigits(date.getHours())}:${twoDigits(date.getMinutes())}`;
      }

      function dividerTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const dayDifference = Math.round((today - target) / 86400000);
        const time = shortTime(timestamp);

        if (dayDifference === 0) return time;
        if (dayDifference === 1) return `昨天 ${time}`;
        if (date.getFullYear() === now.getFullYear()) {
          return `${date.getMonth() + 1}月${date.getDate()}日 ${time}`;
        }
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${time}`;
      }

      function makeElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function avatarColor(userId) {
        const colors = ["#607d8b", "#7986cb", "#4db6ac", "#9575cd", "#a1887f", "#90a955", "#64b5f6"];
        let hash = 0;
        for (const character of userId) {
          hash = ((hash << 5) - hash + character.charCodeAt(0)) | 0;
        }
        return colors[Math.abs(hash) % colors.length];
      }

      function renderMessages(forceToBottom = false) {
        const distanceToBottom = messagesElement.scrollHeight - messagesElement.scrollTop - messagesElement.clientHeight;
        const shouldScroll = forceToBottom || distanceToBottom < 80;
        messagesElement.replaceChildren();

        if (!messages.length) {
          messagesElement.appendChild(makeElement("div", "empty-state", "还没有消息，说点什么吧。"));
          return;
        }

        let previousTime = 0;
        for (const message of messages) {
          if (message.createdAt - previousTime > 5 * 60 * 1000) {
            messagesElement.appendChild(makeElement("div", "time-divider", dividerTime(message.createdAt)));
          }
          previousTime = message.createdAt;

          if (message.recalled) {
            const recallText = profile && message.userId === profile.id
              ? "你撤回了一条消息"
              : `“${message.name}”撤回了一条消息`;
            messagesElement.appendChild(makeElement("div", "system-message", recallText));
            continue;
          }

          const isOwn = profile && message.userId === profile.id;
          const row = makeElement("article", `message-row${isOwn ? " own" : ""}`);
          row.dataset.messageId = message.id;

          const avatar = makeElement("div", "avatar", Array.from(message.name || "?")[0]);
          avatar.style.backgroundColor = avatarColor(message.userId);

          const content = makeElement("div", "message-content");
          if (!isOwn) {
            content.appendChild(makeElement("div", "sender-name", message.name));
          }

          if (message.type === "image") {
            const bubble = makeElement("div", "bubble image-bubble");
            const image = document.createElement("img");
            image.className = "message-image";
            image.src = message.image;
            image.alt = `${message.name}发送的图片`;
            image.loading = "lazy";
            image.addEventListener("click", () => openImage(message.image));
            bubble.appendChild(image);
            content.appendChild(bubble);
          } else {
            content.appendChild(makeElement("div", "bubble", message.text));
          }

          const meta = makeElement("div", "message-meta");
          const time = makeElement("time", "", shortTime(message.createdAt));
          time.dateTime = new Date(message.createdAt).toISOString();
          time.title = new Date(message.createdAt).toLocaleString("zh-CN");
          meta.appendChild(time);

          if (isOwn) {
            const recallButton = makeElement("button", "recall-button", "撤回");
            recallButton.type = "button";
            recallButton.setAttribute("aria-label", "撤回这条消息");
            recallButton.addEventListener("click", () => recallMessage(message.id));
            meta.appendChild(recallButton);
          }

          content.appendChild(meta);
          row.append(avatar, content);
          messagesElement.appendChild(row);
        }

        if (shouldScroll) {
          requestAnimationFrame(() => {
            messagesElement.scrollTop = messagesElement.scrollHeight;
          });
        }
      }

      function recallMessage(id) {
        const message = messages.find((item) => item.id === id);
        if (!message || !profile || message.userId !== profile.id || message.recalled) return;
        if (!window.confirm("撤回这条消息？")) return;

        message.recalled = true;
        delete message.text;
        delete message.image;
        saveMessages();
        renderMessages();
        notifyOtherTabs();
      }

      function newTextMessage(text) {
        return {
          id: createId(),
          userId: profile.id,
          name: profile.name,
          type: "text",
          text,
          createdAt: Date.now(),
          recalled: false
        };
      }

      function newImageMessage(image) {
        return {
          id: createId(),
          userId: profile.id,
          name: profile.name,
          type: "image",
          image: image.dataUrl,
          createdAt: Date.now(),
          recalled: false
        };
      }

      function updateSendButton() {
        sendButton.disabled = sending || (!messageInput.value.trim() && pendingImages.length === 0);
      }

      function resizeInput() {
        messageInput.style.height = "auto";
        messageInput.style.height = `${Math.min(messageInput.scrollHeight, 120)}px`;
      }

      function sendMessages() {
        const text = messageInput.value.trim();
        if (!profile) {
          openProfileDialog(false);
          return;
        }
        if (sending || (!text && pendingImages.length === 0)) return;

        sending = true;
        if (text) messages.push(newTextMessage(text));
        for (const image of pendingImages) {
          messages.push(newImageMessage(image));
        }
        if (messages.length > MAX_MESSAGES) {
          messages = messages.slice(-MAX_MESSAGES);
        }

        messageInput.value = "";
        pendingImages = [];
        resizeInput();
        renderPreviews();
        saveMessages();
        renderMessages(true);
        notifyOtherTabs();
        sending = false;
        updateSendButton();
        messageInput.focus();
      }

      function renderPreviews() {
        previewList.replaceChildren();
        previewList.hidden = pendingImages.length === 0;

        for (const item of pendingImages) {
          const preview = makeElement("div", "preview-item");
          const image = document.createElement("img");
          image.src = item.dataUrl;
          image.alt = item.name;

          const remove = makeElement("button", "remove-preview", "×");
          remove.type = "button";
          remove.setAttribute("aria-label", "移除这张图片");
          remove.addEventListener("click", () => {
            pendingImages = pendingImages.filter((imageItem) => imageItem.id !== item.id);
            renderPreviews();
            updateSendButton();
          });

          preview.append(image, remove);
          previewList.appendChild(preview);
        }
      }

      function readFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function compressImage(file) {
        const source = await readFile(file);
        const image = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });

        const maxSize = 1280;
        const scale = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.85);
      }

      async function selectImages() {
        const files = Array.from(imageInput.files || []);
        imageInput.value = "";
        if (!files.length) return;

        const available = MAX_IMAGES - pendingImages.length;
        if (available <= 0) {
          showToast(`一次最多发送 ${MAX_IMAGES} 张图片`);
          return;
        }
        if (files.length > available) {
          showToast(`一次最多发送 ${MAX_IMAGES} 张图片`);
        }

        for (const file of files.slice(0, available)) {
          if (!file.type.startsWith("image/")) {
            showToast("只能选择图片文件");
            continue;
          }
          if (file.size > 15 * 1024 * 1024) {
            showToast("图片不能超过 15MB");
            continue;
          }

          try {
            const dataUrl = await compressImage(file);
            pendingImages.push({ id: createId(), name: file.name, dataUrl });
            renderPreviews();
            updateSendButton();
          } catch {
            showToast("这张图片读取失败，换一张试试");
          }
        }
      }

      function openImage(source) {
        viewerImage.src = source;
        imageViewer.showModal();
      }

      function openProfileDialog(isRename) {
        profileTitle.textContent = isRename ? "修改名字" : "进入聊天室";
        profileDescription.hidden = isRename;
        profileConfirm.textContent = isRename ? "保存" : "进入";
        cancelRename.hidden = !isRename;
        nameInput.value = isRename && profile ? profile.name : "";
        nameError.textContent = "";
        profileDialog.showModal();
        requestAnimationFrame(() => nameInput.focus());
      }

      profileForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim().replace(/\s+/g, " ");
        if (!name) {
          nameError.textContent = "名字不能为空";
          nameInput.focus();
          return;
        }

        if (!profile) profile = { id: createId(), name };
        else profile.name = name;

        try {
          sessionStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        } catch {
          showToast("当前浏览器无法记住名字");
        }
        currentName.textContent = profile.name;
        profileDialog.close();
        renderMessages();
        messageInput.focus();
      });

      profileDialog.addEventListener("cancel", (event) => {
        if (!profile) event.preventDefault();
      });

      cancelRename.addEventListener("click", () => profileDialog.close());
      renameButton.addEventListener("click", () => openProfileDialog(true));
      sendButton.addEventListener("click", sendMessages);
      imageInput.addEventListener("change", selectImages);
      closeViewer.addEventListener("click", () => imageViewer.close());
      imageViewer.addEventListener("click", (event) => {
        if (event.target === imageViewer) imageViewer.close();
      });

      messageInput.addEventListener("input", () => {
        resizeInput();
        updateSendButton();
      });

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessages();
        }
      });

      window.addEventListener("storage", (event) => {
        if (event.key === MESSAGE_KEY) {
          messages = readJSON(localStorage, MESSAGE_KEY) || [];
          renderMessages();
        }
      });

      if (channel) {
        channel.addEventListener("message", () => {
          messages = readJSON(localStorage, MESSAGE_KEY) || [];
          renderMessages();
        });
      }

      if (profile) {
        currentName.textContent = profile.name;
      } else {
        openProfileDialog(false);
      }
      renderMessages(true);
      updateSendButton();
    })();
  </script>
